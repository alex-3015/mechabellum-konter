<title>Mechabellum Konter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
  // Farbschema, Größe, Farben und Seitenleiste vor dem ersten Zeichnen setzen (Standard: dunkel), damit nichts aufblitzt
  (function () {
    var t = 'dark', s = 'normal', cb = '0', sb = 'on';
    try {
      t = localStorage.getItem('mbk.theme') === 'light' ? 'light' : 'dark';
      s = localStorage.getItem('mbk.size') === 'large' ? 'large' : 'normal';
      cb = localStorage.getItem('mbk.cb');
      cb = cb === '1' || cb === '2' ? cb : '0';
      sb = localStorage.getItem('mbk.sidebar') === 'off' ? 'off' : 'on';
    } catch (e) {}
    var r = document.documentElement;
    r.setAttribute('data-mbk-theme', t);
    r.setAttribute('data-mbk-size', s);
    r.setAttribute('data-mbk-cb', cb);
    r.setAttribute('data-mbk-sidebar', sb);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: HUD-Leiste oben, links das Einheiten-Raster nach Klasse, rechts ein fest stehendes Detail-Panel. Dark-first fürs Spielen. */
:root {
  --bg: #0e1317;
  --surface: #151c22;
  --surface-2: #1c252d;
  --line: #2a3640;
  --fg: #e4e9ed;
  --muted: #8b99a6;
  --accent: #e9a640;
  --accent-bg: rgba(233,166,64,.16);
  --good: #4fc78d;
  --good-bg: rgba(79,199,141,.15);
  --bad: #f2695e;
  --bad-bg: rgba(242,105,94,.15);
  --badge: #2c3945;
  --badge-fg: #dfe6ec;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --font-ui: "Barlow Semi Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf0f2; --surface: #ffffff; --surface-2: #f3f5f7; --line: #cfd7de;
    --fg: #131a20; --muted: #5a6875; --accent: #a8680b; --accent-bg: rgba(168,104,11,.12);
    --good: #19834f; --good-bg: rgba(25,131,79,.11); --bad: #c13a2f; --bad-bg: rgba(193,58,47,.10);
    --badge: #dbe2e8; --badge-fg: #1b252e; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf0f2; --surface: #ffffff; --surface-2: #f3f5f7; --line: #cfd7de;
  --fg: #131a20; --muted: #5a6875; --accent: #a8680b; --accent-bg: rgba(168,104,11,.12);
  --good: #19834f; --good-bg: rgba(25,131,79,.11); --bad: #c13a2f; --bad-bg: rgba(193,58,47,.10);
  --badge: #dbe2e8; --badge-fg: #1b252e; color-scheme: light;
}
/* Umschalter auf der Seite hat Vorrang vor System- und App-Einstellung (steht deshalb zuletzt) */
:root[data-mbk-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --surface-2: #1c252d; --line: #2a3640;
  --fg: #e4e9ed; --muted: #8b99a6; --accent: #e9a640; --accent-bg: rgba(233,166,64,.16);
  --good: #4fc78d; --good-bg: rgba(79,199,141,.15); --bad: #f2695e; --bad-bg: rgba(242,105,94,.15);
  --badge: #2c3945; --badge-fg: #dfe6ec; color-scheme: dark;
}
:root[data-mbk-theme="light"] {
  --bg: #edf0f2; --surface: #ffffff; --surface-2: #f3f5f7; --line: #cfd7de;
  --fg: #131a20; --muted: #5a6875; --accent: #a8680b; --accent-bg: rgba(168,104,11,.12);
  --good: #19834f; --good-bg: rgba(25,131,79,.11); --bad: #c13a2f; --bad-bg: rgba(193,58,47,.10);
  --badge: #dbe2e8; --badge-fg: #1b252e; color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* HUD-Leiste */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 22px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
h1 b { color: var(--accent); font-weight: 700; }
.patch { font: 500 13px/1 var(--font-ui); color: var(--muted); letter-spacing: .04em; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search input {
  width: min(260px, 70vw); height: 36px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  color: var(--fg); font: 500 15px var(--font-ui);
}
.search input::placeholder { color: var(--muted); }
.toggle {
  display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 12px 0 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  font: 600 14px var(--font-ui); letter-spacing: .03em;
}
.toggle .track { width: 30px; height: 16px; border-radius: 8px; background: var(--badge); position: relative; transition: background .15s; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { border-color: var(--accent); }
.toggle[aria-pressed="true"] .track { background: var(--accent-bg); }
.toggle[aria-pressed="true"] .track::after { transform: translateX(14px); background: var(--accent); }

/* Sprachwahl DE / EN */
.lang { display: inline-flex; height: 36px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.lang button {
  min-width: 40px; padding: 0 10px; border: 0; background: none; cursor: pointer;
  font: 700 13px var(--font-display); letter-spacing: .08em; color: var(--muted);
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 14px; font: 500 14px var(--font-ui); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; display: inline-grid; place-items: center; font-size: 9px; }
.sw.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.sw.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.sw.sel { background: var(--accent-bg); border-color: var(--accent); }

/* Hauptbereich */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 20px; align-items: start; }
/* Jede Klasse ist eine Spalte, darin von oben nach unten nach Kosten sortiert */
.roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 16px 8px; align-items: start; min-width: 0; }
.group { min-width: 0; }
/* große Gruppen (z. B. Stufe I) belegen zwei Spalten */
.group.wide { grid-column: span 2; }
.group.wide .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.roman { font: 700 16px/1 var(--font-display); color: var(--accent); letter-spacing: .04em; }
.stage-cost { font: 500 12.5px/1 var(--font-ui); letter-spacing: .02em; text-transform: none; }
.group-title {
  display: flex; align-items: center; gap: 8px; margin: 0 0 7px; padding: 0 2px 7px; border-bottom: 1px solid var(--line);
  font: 600 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.group-title .count { font-family: var(--font-ui); letter-spacing: 0; opacity: .7; margin-left: auto; }
.tiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; }

.tile {
  position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); align-items: center; gap: 10px;
  min-height: 58px; padding: 5px 22px 5px 5px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  transition: opacity .12s, background .12s, border-color .12s;
}
.tile:hover { border-color: var(--muted); }
.tname { display: block; font: 600 15.5px/1.1 var(--font-ui); hyphens: manual; overflow-wrap: anywhere; }
.tname.long { font-size: 14.5px; }
.tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font: 500 12px/1.2 var(--font-ui); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.tg { display: inline-flex; align-items: center; gap: 4px; }
.ico { display: inline-flex; }
.ico svg { height: 12px; width: auto; fill: currentColor; }
.ico.on { color: var(--fg); }
.ico.off { color: var(--muted); opacity: .3; }
.ico.tech { color: var(--accent); opacity: 1; }
.mark { position: absolute; top: 5px; right: 7px; font-size: 12px; line-height: 1; }
/* Unbeteiligte Einheiten entfärbt und abgedunkelt, damit Konter sofort herausstechen */
.roster.focus .tile[data-rel=""] { opacity: .5; }
.roster.focus .tile[data-rel=""] .pic img { filter: grayscale(1) brightness(.75); }
.roster.focus .tile[data-rel=""] .tname { color: var(--muted); }
.tile[data-rel="good"] { background: var(--good-bg); border-color: var(--good); }
.tile[data-rel="good"] .mark { color: var(--good); }
.tile[data-rel="bad"] { background: var(--bad-bg); border-color: var(--bad); }
.tile[data-rel="bad"] .mark { color: var(--bad); }
.tile[data-rel="sel"] { background: var(--accent-bg); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile.dim { opacity: .15 !important; }

/* Einheitenbild; ohne Bild ein Kürzel-Abzeichen */
.pic {
  width: 46px; height: 46px; flex: none; display: grid; place-items: center; overflow: hidden;
  border-radius: 5px; background: var(--badge); color: var(--badge-fg);
  font: 700 13px/1 var(--font-display); letter-spacing: .02em;
}
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile[data-rel="good"] .pic { box-shadow: 0 0 0 2px var(--good); }
.tile[data-rel="bad"] .pic { box-shadow: 0 0 0 2px var(--bad); }
.tile[data-rel="sel"] .pic { box-shadow: 0 0 0 2px var(--accent); }

/* Detail-Panel */
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-height: calc(100vh - 24px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px;
  min-width: 0;
}
.p-head { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; }
.p-head .pic { width: 76px; height: 76px; border-radius: 7px; font-size: 20px; box-shadow: 0 0 0 2px var(--accent); }
.p-head h2 { margin: 0; font: 700 24px/1.05 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.p-alt { font: 500 13px/1.2 var(--font-ui); color: var(--muted); margin-top: 3px; }
.p-meta { font: 500 14px/1.3 var(--font-ui); color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0 2px; }
.chip { font: 600 12px/1 var(--font-ui); letter-spacing: .04em; padding: 5px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); }
.sec { margin-top: 16px; }
.sec h3 {
  display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  font: 700 13px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase;
}
.sec.good h3 { color: var(--good); }
.sec.bad h3 { color: var(--bad); }
.sec h3 small { font: 500 13px var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: auto; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.go {
  width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center;
  padding: 5px 6px; background: none; border: 0; border-radius: 5px; text-align: left; cursor: pointer;
}
.go:hover { background: var(--surface-2); }
.row .pic { width: 40px; height: 40px; font-size: 11px; }
.sec.good .row .pic { box-shadow: 0 0 0 2px var(--good); }
.sec.bad .row .pic { box-shadow: 0 0 0 2px var(--bad); }
.sec .row.tend .pic { outline: 2px dashed var(--bg); outline-offset: -2px; }
.row.gone .rn, .row.gone .rw { text-decoration: line-through; opacity: .55; }
.sec .row.gone .pic { box-shadow: none; filter: grayscale(1); opacity: .5; }
.rs { display: block; font: 600 12.5px/1.3 var(--font-ui); color: var(--accent); margin-top: 3px; }
.hints { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 6px 4px 56px; }
.hint {
  font: 600 12px/1.2 var(--font-ui); padding: 4px 7px; border-radius: 4px; cursor: pointer; text-align: left;
  border: 1px dashed var(--line); background: none; color: var(--muted);
}
.hint:hover { border-color: var(--accent); color: var(--fg); }
.maybe { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.maybe-title { font: 600 12px var(--font-ui); color: var(--muted); letter-spacing: .04em; padding: 0 6px 2px; }

/* Kurzübersicht im Panel */
.quick { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 8px; margin-top: 10px; }
.qt { font: 700 11.5px/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.quick.good .qt { color: var(--good); }
.quick.bad .qt { color: var(--bad); }
.qi { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.qb { padding: 0; border: 0; background: none; cursor: pointer; line-height: 0; }
.qb .pic { width: 34px; height: 34px; font-size: 11px; }
.quick.good .qb .pic { box-shadow: 0 0 0 2px var(--good); }
.quick.bad .qb .pic { box-shadow: 0 0 0 2px var(--bad); }
.quick .qb.tend .pic { box-shadow: none; outline: 2px dashed var(--muted); outline-offset: 0; }
.qb:hover .pic { transform: translateY(-1px); }
.qmore { font: 600 13px var(--font-ui); color: var(--muted); }

/* Techs */
.lvl {
  display: inline-block; margin-left: 6px; padding: 2px 5px; border-radius: 3px; vertical-align: 1px;
  font: 700 10px/1.1 var(--font-display); letter-spacing: .08em; text-transform: uppercase;
}
.lvl.belegt { border: 1px solid var(--fg); color: var(--fg); }
.lvl.tendenz { border: 1px dashed var(--muted); color: var(--muted); }
.sec.tech h3 { color: var(--accent); }
.techs { display: flex; flex-direction: column; gap: 6px; }
.tech-opt {
  width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; padding: 8px 9px; text-align: left; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
}
.tech-opt:hover { border-color: var(--muted); }
.tech-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
.tech-opt .box { width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid var(--muted); border-radius: 4px; display: grid; place-items: center; font-size: 12px; line-height: 1; }
.tech-opt[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); color: var(--bg); }
.tech-name { font: 600 15px/1.2 var(--font-ui); }
.tech-eff { display: block; font-size: 13.5px; line-height: 1.35; margin-top: 3px; }
.tech-game { display: block; font-size: 12.5px; line-height: 1.35; color: var(--muted); margin-top: 3px; }
.techbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -4px 0 14px; font: 500 14px var(--font-ui); color: var(--muted); }
.tchip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 8px; cursor: pointer;
  border: 1px solid var(--accent); border-radius: 5px; background: var(--accent-bg); color: var(--fg); font: 600 13px var(--font-ui);
}
.tchip .x { color: var(--muted); font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0 4px; color: var(--muted); text-decoration: underline; cursor: pointer; font: 500 13px var(--font-ui); }
.tile[data-tend="1"] { border-style: dashed; }
.ttech { color: var(--accent); font-weight: 700; }
.row .rn { font: 600 16px/1.1 var(--font-ui); }
.row .rw { display: block; font: 400 13.5px/1.3 var(--font-body); color: var(--muted); margin-top: 1px; }
.row .rw em { font-style: normal; opacity: .75; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 6px; }
.note { margin: 14px 0 0; padding: 9px 11px; border-radius: 5px; background: var(--surface-2); font-size: 13.5px; color: var(--muted); }
.note b { color: var(--fg); font-weight: 500; }

footer {
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 20px;
  margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px;
}
footer a { color: var(--muted); }
footer p { margin: 4px 0; }
/* Infos zu Quellen und Bedienung: standardmäßig eingeklappt */
.info { flex: 1 1 320px; min-width: 0; }
.info > summary {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; user-select: none;
  font: 600 13px var(--font-ui); letter-spacing: .04em; color: var(--muted);
}
.info > summary::-webkit-details-marker { display: none; }
.info > summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
.info[open] > summary::before { transform: rotate(90deg); }
.info > summary:hover { color: var(--fg); }
.info-body { margin-top: 8px; max-width: 80ch; }
/* Ko-fi: oben rechts in der Kopfzeile, dezent, aber immer sichtbar */
.kofi {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; white-space: nowrap; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--fg);
  font: 600 13px var(--font-ui); letter-spacing: .03em;
}
.kofi svg { width: 16px; height: 16px; fill: currentColor; color: var(--accent); }
.kofi:hover { border-color: var(--accent); }
kbd { font: 600 11px var(--font-ui); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; color: var(--fg); }

[hidden] { display: none !important; }

/* Ansicht-Menü */
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; cursor: pointer; user-select: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font: 600 14px var(--font-ui); letter-spacing: .03em;
}
.menu[open] > .menu-btn { border-color: var(--accent); }
.menu-btn .caret { font-size: 10px; color: var(--muted); }
.menu-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; display: grid; gap: 9px; padding: 12px; min-width: 300px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.35);
}
.mrow { display: grid; grid-template-columns: 74px auto; align-items: center; gap: 10px; }
.mlabel { font: 600 13px var(--font-ui); color: var(--muted); letter-spacing: .03em; }
.mrow .lang { justify-self: start; }

/* Hinweis an der Kachel */
.tip {
  position: fixed; z-index: 50; max-width: 270px; padding: 7px 10px; pointer-events: none;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.35);
  font: 400 13.5px/1.35 var(--font-body); color: var(--fg);
}
.tip b { display: block; font: 600 14.5px/1.2 var(--font-ui); margin-bottom: 2px; }
.tip.good b { color: var(--good); }
.tip.bad b { color: var(--bad); }
.tip .tw { display: block; color: var(--muted); }

/* Leerer Zustand des Panels */
.empty-state h2 { margin: 0 0 6px; font: 700 20px/1.2 var(--font-display); letter-spacing: .02em; }
.empty-state p { margin: 0; color: var(--muted); font-size: 14px; }

/* Größe: alles im Hauptbereich etwas größer */
:root[data-mbk-size="large"] { --zoom: 1.2; }
:root[data-mbk-size="large"] .layout { zoom: 1.2; }
:root[data-mbk-size="large"] .panel { max-height: calc((100vh - 24px) / var(--zoom)); top: calc((env(safe-area-inset-top, 0px) + 12px) / var(--zoom)); }

/* Farbschwäche: Blau/Orange statt Grün/Rot, Auswahl neutral hell bzw. dunkel */
:root[data-mbk-cb="1"][data-mbk-theme="dark"] {
  --good: #5aa9ff; --good-bg: rgba(90,169,255,.17); --bad: #ff8c42; --bad-bg: rgba(255,140,66,.17);
  --accent: #eef1f4; --accent-bg: rgba(238,241,244,.13);
}
:root[data-mbk-cb="1"][data-mbk-theme="light"] {
  --good: #1f6fd1; --good-bg: rgba(31,111,209,.12); --bad: #c25400; --bad-bg: rgba(194,84,0,.12);
  --accent: #1d2731; --accent-bg: rgba(29,39,49,.09);
}

/* Farbschwäche Blau-Gelb (Tritanopie): Türkis/Rot, Auswahl neutral (Bernstein wäre dort mit Rot verwechselbar) */
:root[data-mbk-cb="2"][data-mbk-theme="dark"] {
  --good: #3fd0c9; --good-bg: rgba(63,208,201,.16); --bad: #ff5a7a; --bad-bg: rgba(255,90,122,.16);
  --accent: #eef1f4; --accent-bg: rgba(238,241,244,.13);
}
:root[data-mbk-cb="2"][data-mbk-theme="light"] {
  --good: #0b7f7a; --good-bg: rgba(11,127,122,.12); --bad: #c8174d; --bad-bg: rgba(200,23,77,.11);
  --accent: #1d2731; --accent-bg: rgba(29,39,49,.09);
}

/* Seitenleiste ausgeblendet: Raster nutzt die volle Breite */
:root[data-mbk-sidebar="off"] .layout { grid-template-columns: minmax(0, 1fr); }
:root[data-mbk-sidebar="off"] .panel { display: none; }

/* Sprachauswahl im Ansicht-Menü */
.langsel {
  height: 32px; padding: 0 8px; cursor: pointer; max-width: 100%;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 600 13.5px var(--font-ui);
}
.menu-panel { max-width: calc(100vw - 32px); }
.mrow { grid-template-columns: minmax(74px, max-content) auto; }

/* Lange Namen: feste Trennstellen für DE/EN, sonst automatische Silbentrennung */
:root:not(:lang(de)):not(:lang(en)) .tname { hyphens: auto; }

/* Schriften: die Webfonts decken kein CJK ab, daher passende Systemschriften je Sprache */
:root:lang(ja) {
  --font-display: "Chakra Petch", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-ui: "Barlow Semi Condensed", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-body: "Barlow", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}

  --font-ui: "Barlow Semi Condensed", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Barlow", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
:root:lang(zh-CN) {
  --font-display: "Chakra Petch", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-ui: "Barlow Semi Condensed", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Barlow", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
:root:lang(zh-TW) {

  --font-ui: "Barlow Semi Condensed", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Barlow", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}

/* Abgeschrägte Ecken im Stil der Spieloberfläche; Browser ohne corner-shape behalten abgerundete Ecken */
@supports (corner-shape: bevel) {
  .tile, .panel, .pic, .tech-opt, .menu-panel, .search input, .toggle, .menu-btn, .lang, .tchip, .chip, .tip, .note, .go, .hint, .sw, .kofi, .langsel { corner-shape: bevel; }
  .kofi { border-radius: 8px; }
  .tile { border-radius: 10px; }
  .panel { border-radius: 16px; }
  .pic { border-radius: 8px; }
  .p-head .pic { border-radius: 12px; }
  .qb .pic, .row .pic { border-radius: 7px; }
  .tech-opt, .menu-panel { border-radius: 10px; }
  .search input, .toggle, .menu-btn, .lang { border-radius: 8px; }
  .mark { top: 7px; right: 10px; }
}

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; order: -1; }
}
@media (max-width: 420px) {

  .tile .pic { width: 40px; height: 40px; }
}
@media (max-width: 360px) {

  .group.wide .tiles { grid-template-columns: minmax(0, 1fr); }
}

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('unit-data').textContent);
  let ICONS = {}, TECHS = [], I18N = {};
  try { ICONS = JSON.parse(document.getElementById('unit-icons').textContent) || {}; } catch (e) {}
  try { TECHS = JSON.parse(document.getElementById('tech-data').textContent) || []; } catch (e) {}
  try { I18N = JSON.parse(document.getElementById('i18n-data').textContent) || {}; } catch (e) {}
  const LANGS = (I18N.languages || []).filter(l => I18N.strings && I18N.strings[l.code]);
  const SOURCE = (LANGS.find(l => l.source) || { code: 'de' }).code;
  const STR = I18N.strings || {};
  const CLASS_ORDER = ['small', 'medium', 'large', 'giant', 'air', 'titan'];

  const store = {
    get(k) { try { return localStorage.getItem('mbk.' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('mbk.' + k, v); } catch (e) {} }
  };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function normClass(c, tags) {
    if ((tags || []).some(x => /titan/i.test(x))) return 'titan';
    c = String(c || '').toLowerCase();
    if (c.includes('air')) return 'air';
    if (c.includes('giant')) return 'giant';
    if (c.includes('large')) return 'large';
    if (c.includes('medium')) return 'medium';
    return 'small';
  }
  function normTargets(t) {
    t = String(t || '').toLowerCase();
    if (t.includes('both') || (t.includes('air') && t.includes('ground'))) return 'both';
    if (t.includes('air')) return 'air';
    return 'ground';
  }

  const units = DATA.units.map(u => ({
    ...u, cls: normClass(u.class, u.tags), tgt: normTargets(u.targets),
    flies: u.class === 'air' || (u.tags || []).includes('flying'),
    strong: u.strong || [], weak: u.weak || [], names: u.names || { en: u.name }
  }));
  const byId = Object.fromEntries(units.map(u => [u.id, u]));
  // Suche findet Namen in allen Sprachen
  units.forEach(u => { u.search = Object.values(u.names).concat(u.name).join('\n').toLowerCase(); });

  // Kürzel als Ersatz, falls ein Bild fehlt
  const used = new Set();
  units.forEach(u => {
    const words = u.name.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
    const cands = [];
    if (words.length > 1) cands.push(words[0][0].toUpperCase() + words[1][0].toUpperCase());
    const w = words.join('');
    for (let i = 1; i < w.length; i++) cands.push(w[0].toUpperCase() + w[i].toLowerCase());
    u.abbr = cands.find(c => !used.has(c)) || w.slice(0, 3);
    used.add(u.abbr);
  });

  // ---------- Sprache ----------
  function detectLang() {
    const saved = store.get('lang');
    if (saved && STR[saved]) return saved;
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']).map(s => String(s).toLowerCase());
    for (const p of prefs) {
      let c = null;
      if (p.startsWith('zh')) c = /(tw|hk|mo|hant)/.test(p) ? 'zh-TW' : 'zh-CN';
      else if (p.startsWith('es')) c = (p === 'es' || p === 'es-es') ? 'es' : 'es-419';
      else c = p.split('-')[0];
      if (STR[c]) return c;
    }
    return STR.en ? 'en' : SOURCE;
  }
  let lang = detectLang();
  const nm = u => u.names[lang] || u.names.en || u.name;
  const alt = u => (lang === 'en' ? '' : (u.names.en || u.name));
  const techName = ref => { const n = (DATA.techNames || {})[ref]; return n ? (n[lang] || n.en) : ref; };
  const tn = t => t.names[lang] || t.names.en;
  const gameText = t => String(t.descs[lang] || t.descs.en || '').replace(/\{\d+\}/g, '…');
  // Übersetzung: {u:id} = Einheitenname aus dem Spiel, {t:ref} = Tech-Name aus dem Spiel, {name} usw. = Werte
  function t(key, vars) {
    let s = (STR[lang] && STR[lang][key]) ?? (STR[SOURCE] && STR[SOURCE][key]) ?? key;
    s = s.replace(/\{u:([a-z0-9_]+)\}/g, (m, id) => byId[id] ? nm(byId[id]) : m)
      .replace(/\{t:([a-z0-9_]+)\}/g, (m, ref) => techName(ref));
    if (vars) s = s.replace(/\{([a-zA-Z]+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return s;
  }
  const has = key => !!(STR[SOURCE] && key in STR[SOURCE]);
  // Feste Trennstellen für lange Namen (nur DE/EN, andere Sprachen nutzen automatische Silbentrennung)
  const HYPH = {
    'Vorschlaghammer': 'Vorschlag|hammer', 'Phantomstrahl': 'Phantom|strahl', 'Kriegsfabrik': 'Kriegs|fabrik',
    'Schmelzpunkt': 'Schmelz|punkt', 'Scharfschütze': 'Scharf|schütze', 'Weitblicker': 'Weit|blicker',
    'Totenglocke': 'Toten|glocke', 'Feuerdachs': 'Feuer|dachs', 'Stahlkugel': 'Stahl|kugel', 'Sturmrufer': 'Sturm|rufer',
    'Säbelzahn': 'Säbel|zahn', 'Sledgehammer': 'Sledge|hammer', 'Stormcaller': 'Storm|caller', 'Sabertooth': 'Saber|tooth'
  };
  const nmh = u => { const n = nm(u); return HYPH[n] ? HYPH[n].replace('|', '­') : n; };

  // ---------- Techs ----------
  const techByKey = Object.fromEntries(TECHS.map(x => [x.key, x]));
  const techsOf = {};
  TECHS.forEach(x => (techsOf[x.unit] = techsOf[x.unit] || []).push(x));
  let active = new Set();
  try { (JSON.parse(store.get('techs') || '[]') || []).forEach(k => techByKey[k] && active.add(k)); } catch (e) {}
  const saveTechs = () => store.set('techs', JSON.stringify([...active]));

  function flags(u, act) {
    const f = { hitsAir: u.tgt !== 'ground', hitsGround: u.tgt !== 'air', flies: u.flies, src: {} };
    (techsOf[u.id] || []).forEach(x => {
      if (!act.has(x.key) || !x.set) return;
      Object.entries(x.set).forEach(([k, v]) => { f[k] = v; f.src[k] = x; });
    });
    return f;
  }
  const tgtOf = f => f.hitsAir && f.hitsGround ? 'both' : f.hitsAir ? 'air' : 'ground';

  // Macht eine Tech den Konter "a schlägt b" unmöglich? 'base' = schon ohne Tech unstimmig (wird ignoriert)
  function breaker(a, b, noAir, act) {
    const fa = flags(a, act), fb = flags(b, act);
    if (fb.flies && !fa.hitsAir) return fa.src.hitsAir || fb.src.flies || 'base';
    if (!fb.flies && !fa.hitsGround) return fa.src.hitsGround || fb.src.flies || 'base';
    if (noAir) {
      if (!fa.flies) return fa.src.flies || 'base';
      if (fb.hitsAir) return fb.src.hitsAir || 'base';
    }
    return null;
  }
  const weakEntry = (x, a, b) => (x.weaken || []).find(w => w.a === a.id && w.b === b.id);

  function basePairs(x) {
    const out = [], seen = new Set();
    const push = (dir, other, whyKey, noAir) => {
      if (seen.has(other) || !byId[other]) return;
      seen.add(other);
      out.push({ dir, id: other, whyKey, noAir: !!noAir, a: dir === 'good' ? byId[other] : x, b: dir === 'good' ? x : byId[other] });
    };
    x.weak.forEach(r => push('good', r.id, `why.w.${x.id}.${r.id}`, r.noAir));
    x.strong.forEach(r => push('bad', r.id, `why.s.${x.id}.${r.id}`, r.noAir));
    units.forEach(u => {
      if (u.id === x.id) return;
      u.strong.forEach(r => { if (r.id === x.id) push('good', u.id, `why.s.${u.id}.${x.id}`, r.noAir); });
      u.weak.forEach(r => { if (r.id === x.id) push('bad', u.id, `why.w.${u.id}.${x.id}`, r.noAir); });
    });
    return out;
  }

  function evaluate(x, act) {
    const list = basePairs(x).map(p => {
      const br = breaker(p.a, p.b, p.noAir, act);
      if (br && br !== 'base') return { ...p, status: 'gone', tech: br, level: br.level };
      const wt = TECHS.find(k => act.has(k.key) && weakEntry(k, p.a, p.b));
      if (wt) return { ...p, status: 'weak', tech: wt, level: 'tendenz', noteKey: `tech.${wt.key}.weaken.${p.a.id}.${p.b.id}` };
      return { ...p, status: 'ok' };
    });
    const haveIds = new Set(list.map(p => p.id));
    TECHS.filter(k => act.has(k.key)).forEach(k => (k.add || []).forEach(ad => {
      const dir = ad.b === x.id ? 'good' : ad.a === x.id ? 'bad' : null;
      if (!dir) return;
      const other = dir === 'good' ? ad.a : ad.b;
      if (haveIds.has(other) || !byId[other] || breaker(byId[ad.a], byId[ad.b], false, act)) return;
      haveIds.add(other);
      list.push({ dir, id: other, whyKey: `tech.${k.key}.add.${ad.a}.${ad.b}`, a: byId[ad.a], b: byId[ad.b], status: 'new', tech: k, level: ad.level || 'tendenz' });
    }));
    return list;
  }

  function hintsFor(p) {
    if (p.status !== 'ok') return [];
    const cands = [...(techsOf[p.a.id] || []), ...(techsOf[p.b.id] || [])].filter(x => !active.has(x.key));
    const out = [];
    cands.forEach(x => {
      const act2 = new Set(active); act2.add(x.key);
      if (breaker(p.a, p.b, p.noAir, act2) === x) out.push({ x, eff: t('ui.status.gone') });
      else if (weakEntry(x, p.a, p.b)) out.push({ x, eff: t('ui.status.weak') });
    });
    return out;
  }
  function maybeNew(x, dir, have) {
    const out = [];
    TECHS.filter(k => !active.has(k.key)).forEach(k => (k.add || []).forEach(ad => {
      const d = ad.b === x.id ? 'good' : ad.a === x.id ? 'bad' : null;
      const other = d === 'good' ? ad.a : ad.b;
      if (d !== dir || have.has(other) || !byId[other]) return;
      const act2 = new Set(active); act2.add(k.key);
      if (breaker(byId[ad.a], byId[ad.b], false, act2)) return;
      out.push({ k, id: other, whyKey: `tech.${k.key}.add.${ad.a}.${ad.b}` });
    }));
    return out;
  }

  // ---------- Darstellung ----------
  const roster = document.getElementById('roster');
  const panel = document.getElementById('panel');
  const techbar = document.getElementById('techbar');
  const q = document.getElementById('q');
  const hoverBtn = document.getElementById('hover-toggle');
  const langSel = document.getElementById('langsel');
  const menu = document.getElementById('view-menu');
  const btns = sel => [...document.querySelectorAll(sel)];
  const groupBtns = btns('.lang button[data-group-set]'), themeBtns = btns('.lang button[data-theme-set]');
  const sizeBtns = btns('.lang button[data-size-set]'), cbBtns = btns('.lang button[data-cb-set]'), sideBtns = btns('.lang button[data-sidebar-set]');
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip');
  document.body.appendChild(tip);

  const pic = u => ICONS[u.id]
    ? `<span class="pic"><img src="${ICONS[u.id]}" alt="" loading="lazy" decoding="async"></span>`
    : `<span class="pic">${esc(u.abbr)}</span>`;
  const lvl = l => `<span class="lvl ${l}">${esc(t(l === 'belegt' ? 'ui.level.proven' : 'ui.level.tendency'))}</span>`;
  const owner = x => esc(nm(byId[x.unit]));
  const ICO_G = '<svg viewBox="0 0 24 16" aria-hidden="true"><path d="M8 2.5h6v3.5H8zM14 3.4h8.5v1.6H14zM3.5 6h15.5v4H3.5zM3.2 10.6h17.6a2.2 2.2 0 0 1 0 4.4H3.2a2.2 2.2 0 0 1 0-4.4z"/></svg>';
  const ICO_A = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
  function targetIcons(f) {
    const cls = (on, src) => 'ico ' + (on ? 'on' : 'off') + (src ? ' tech' : '');
    const label = t('ui.target.' + tgtOf(f)) + (f.src.hitsAir ? ' ' + t('ui.target.byTech') : '');
    return `<span class="tg" role="img" aria-label="${esc(label)}" title="${esc(label)}"><span class="${cls(f.hitsGround, f.src.hitsGround)}">${ICO_G}</span><span class="${cls(f.hitsAir, f.src.hitsAir)}">${ICO_A}</span></span>`;
  }
  const tierText = u => u.unlockSpecial ? t('ui.tier.special') : (u.unlock ? t('ui.tier.unlock', { n: u.unlock }) : t('ui.tier.start'));

  // Statische Texte der Seite übersetzen
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('ui.docTitle');
    btns('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    btns('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    btns('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    btns('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    let date = DATA.patchDate || '';
    try { date = new Intl.DateTimeFormat(lang, { dateStyle: 'medium' }).format(new Date(DATA.patchDate + 'T12:00:00')); } catch (e) {}
    document.getElementById('patch').textContent = t('ui.patchLine', { count: units.length, patch: DATA.patch || '?', date });
    renderFooter();
  }

  // Gruppierung: nach Klasse oder wie im Spiel nach Stufe I–IV
  const STAGES = [{ n: 'I', stage: 1 }, { n: 'II', stage: 2 }, { n: 'III', stage: 3 }, { n: 'IV', stage: 4 }];
  let grouping = store.get('group') === 'stage' ? 'stage' : 'class';
  let tiles = [], tileById = {};
  const byCost = (a, b) => (a.cost || 0) - (b.cost || 0) || a.name.localeCompare(b.name);
  const tileHtml = u => `
        <button type="button" class="tile" data-id="${esc(u.id)}" data-rel="">
          ${pic(u)}
          <span><span class="tname"></span><span class="tmeta"></span></span>
          <span class="mark" aria-hidden="true"></span>
        </button>`;
  function buildRoster() {
    let groups;
    if (grouping === 'stage') {
      groups = STAGES.map(s => ({ title: `<span class="roman">${s.n}</span>`, list: units.filter(u => u.stage === s.stage) }));
      const rest = units.filter(u => !STAGES.some(s => s.stage === u.stage));
      if (rest.length) groups.push({ title: esc(t('ui.group.none')), list: rest });
    } else {
      groups = CLASS_ORDER.map(cls => ({ title: esc(t('ui.class.' + cls)), list: units.filter(u => u.cls === cls) }));
    }
    roster.innerHTML = groups.filter(g => g.list.length).map(g => {
      const list = g.list.slice().sort(byCost);
      return `<div class="group${list.length > 10 ? ' wide' : ''}"><h2 class="group-title">${g.title} <span class="count">${list.length}</span></h2>
      <div class="tiles">${list.map(tileHtml).join('')}</div></div>`;
    }).join('');
    tiles = [...roster.querySelectorAll('.tile')];
    tileById = Object.fromEntries(tiles.map(x => [x.dataset.id, x]));
    groupBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.groupSet === grouping ? 'true' : 'false'));
  }

  function updateTiles() {
    tiles.forEach(el => {
      const u = byId[el.dataset.id];
      const f = flags(u, active);
      const hasTech = (techsOf[u.id] || []).some(x => active.has(x.key));
      const name = el.querySelector('.tname');
      name.textContent = nmh(u);
      name.classList.toggle('long', nm(u).length > 13);
      el.querySelector('.tmeta').innerHTML = `${u.cost ? `<span class="tc">${u.cost}</span>` : ''}${targetIcons(f)}${f.flies && (u.cls === 'titan' || !u.flies) ? `<span>${esc(t('ui.tile.flies'))}</span>` : ''}${!f.flies && u.flies ? `<span>${esc(t('ui.tile.grounded'))}</span>` : ''}${hasTech ? `<span class="ttech">⚙ ${esc(t('ui.tile.tech'))}</span>` : ''}`;
    });
  }

  let current = null;
  let relMap = {};
  function select(id, opts = {}) {
    const x = byId[id];
    if (!x || (id === current && !opts.force)) return;
    current = id;
    if (opts.save !== false) store.set('sel', id);
    const list = evaluate(x, active);
    const rel = {};
    list.forEach(p => { if (p.status !== 'gone') rel[p.id] = p; });
    relMap = rel;
    tiles.forEach(el => {
      const tid = el.dataset.id;
      const p = rel[tid];
      const r = tid === id ? 'sel' : p ? p.dir : '';
      el.dataset.rel = r;
      el.dataset.tend = p && p.status !== 'ok' && p.level === 'tendenz' ? '1' : '';
      el.querySelector('.mark').textContent = r === 'good' ? '▲' : r === 'bad' ? '▼' : '';
      el.setAttribute('aria-pressed', r === 'sel' ? 'true' : 'false');
    });
    roster.classList.add('focus');
    renderPanel(x, list);
  }

  function renderEmpty() {
    panel.innerHTML = `<div class="empty-state"><h2>${esc(t('ui.empty.title'))}</h2><p>${esc(t(hover ? 'ui.empty.textHover' : 'ui.empty.text'))}</p></div>`;
  }
  function deselect() {
    if (!current) return;
    current = null;
    relMap = {};
    store.set('sel', '');
    tiles.forEach(el => {
      el.dataset.rel = ''; el.dataset.tend = '';
      el.querySelector('.mark').textContent = '';
      el.setAttribute('aria-pressed', 'false');
    });
    roster.classList.remove('focus');
    hideTip();
    renderEmpty();
  }

  const byLine = p => esc(t('ui.status.by', { tech: tn(p.tech), unit: nm(byId[p.tech.unit]) }));
  function statusLine(p) {
    if (p.status === 'gone') return `<span class="rs">✕ ${esc(t('ui.status.gone'))}${lvl(p.level)} ${byLine(p)}</span>`;
    if (p.status === 'weak') return `<span class="rs">◐ ${esc(t('ui.status.weak'))}${lvl('tendenz')} ${byLine(p)}${p.noteKey && has(p.noteKey) ? ': ' + esc(t(p.noteKey)) : ''}</span>`;
    if (p.status === 'new') return `<span class="rs">＋ ${esc(t('ui.status.new'))}${lvl(p.level)} ${byLine(p)}</span>`;
    return '';
  }
  const whyText = p => (has(p.whyKey) ? esc(t(p.whyKey)) : `<em>${esc(t('ui.sec.noReason'))}</em>`);

  function rowList(list, x, dir) {
    const order = { ok: 0, new: 1, weak: 2, gone: 3 };
    const sorted = list.filter(p => p.dir === dir).sort((a, b) => order[a.status] - order[b.status]);
    let html = sorted.length ? '<ul class="rows">' + sorted.map(p => {
      const u = byId[p.id];
      const hs = hintsFor(p);
      const cls = ['row', p.status === 'gone' ? 'gone' : '', p.status !== 'ok' && p.level === 'tendenz' ? 'tend' : ''].join(' ');
      return `<li class="${cls}">
        <button type="button" class="go" data-go="${esc(p.id)}">
          ${pic(u)}
          <span><span class="rn">${esc(nmh(u))}</span><span class="rw">${whyText(p)}</span>${statusLine(p)}</span>
        </button>
        ${hs.length ? `<div class="hints">${hs.map(h => `<button type="button" class="hint" data-tech="${esc(h.x.key)}" title="${esc(t('ui.hint.title'))}">⚙ ${esc(t('ui.hint.with', { tech: tn(h.x), unit: nm(byId[h.x.unit]), effect: h.eff }))}</button>`).join('')}</div>` : ''}
      </li>`;
    }).join('') + '</ul>' : `<p class="empty">${esc(t('ui.sec.empty'))}</p>`;
    const mb = maybeNew(x, dir, new Set(list.map(p => p.id)));
    if (mb.length) {
      html += `<div class="maybe"><div class="maybe-title">${esc(t('ui.maybe.title'))}</div><div class="hints" style="padding-left:6px">${mb.map(m =>
        `<button type="button" class="hint" data-tech="${esc(m.k.key)}" title="${esc(t('ui.hint.title'))}">⚙ ${esc(t('ui.maybe.item', { name: nm(byId[m.id]), tech: tn(m.k), unit: nm(byId[m.k.unit]), why: has(m.whyKey) ? t(m.whyKey) : '' }))}</button>`).join('')}</div></div>`;
    }
    return html;
  }

  function techSection(x) {
    const ts = techsOf[x.id] || [];
    if (!ts.length) return '';
    return `<div class="sec tech"><h3>⚙ ${esc(t('ui.techs.title'))} <small>${esc(t('ui.techs.hint'))}</small></h3><div class="techs">${ts.map(k => {
      const on = active.has(k.key);
      return `<button type="button" class="tech-opt" data-tech="${esc(k.key)}" aria-pressed="${on}">
        <span class="box" aria-hidden="true">${on ? '✓' : ''}</span>
        <span><span class="tech-name">${esc(tn(k))}</span>${lvl(k.level)}
          <span class="tech-eff">${esc(t(`tech.${k.key}.effect`))}</span>
          <span class="tech-game">${esc(t('ui.techs.gameText'))} <i>${esc(gameText(k))}</i></span></span>
      </button>`;
    }).join('')}</div></div>`;
  }

  function quickRow(list, dir) {
    const order = { ok: 0, new: 1, weak: 2 };
    const ps = list.filter(p => p.dir === dir && p.status !== 'gone').sort((a, b) => order[a.status] - order[b.status]);
    if (!ps.length) return '';
    const shown = ps.slice(0, 6), rest = ps.length - shown.length;
    return `<div class="quick ${dir}"><span class="qt">${dir === 'good' ? '▲ ' + esc(t('ui.quick.buy')) : '▼ ' + esc(t('ui.quick.avoid'))}</span><span class="qi">${shown.map(p => {
      const u = byId[p.id];
      return `<button type="button" class="qb${p.status !== 'ok' && p.level === 'tendenz' ? ' tend' : ''}" data-go="${esc(p.id)}" title="${esc(nm(u))}: ${esc(has(p.whyKey) ? t(p.whyKey) : '')}" aria-label="${esc(nm(u))}">${pic(u)}</button>`;
    }).join('')}${rest > 0 ? `<span class="qmore">+${rest}</span>` : ''}</span></div>`;
  }

  function renderPanel(x, list) {
    const f = flags(x, active);
    const flyNote = f.src.flies ? ` (${t(f.flies ? 'ui.meta.fliesTech' : 'ui.meta.groundTech')})` : (x.flies && x.cls === 'titan' ? ` (${t('ui.meta.flies')})` : '');
    const tgtNote = t('ui.target.' + tgtOf(f)) + (f.src.hitsAir ? ' ' + t('ui.target.byTech') : '');
    const meta = [t('ui.class1.' + x.cls) + flyNote, x.cost ? t('ui.meta.cost', { n: x.cost }) : '', tierText(x), tgtNote].filter(Boolean).join(' · ');
    const n = esc(nm(x));
    const a = alt(x);
    panel.innerHTML = `
      <div class="p-head">${pic(x)}
        <div><h2>${esc(nmh(x))}</h2>${a && a !== nm(x) ? `<div class="p-alt">EN: ${esc(a)}</div>` : ''}<div class="p-meta">${esc(meta)}</div></div></div>
      ${quickRow(list, 'good')}${quickRow(list, 'bad')}
      ${x.tags && x.tags.length ? `<div class="chips">${x.tags.filter(k => has('tag.' + k)).map(k => `<span class="chip">${esc(t('tag.' + k))}</span>`).join('')}</div>` : ''}
      <div class="sec good"><h3>▲ ${esc(t('ui.sec.good', { name: nm(x) }))} <small>${esc(t('ui.sec.good.hint'))}</small></h3>${rowList(list, x, 'good')}</div>
      <div class="sec bad"><h3>▼ ${esc(t('ui.sec.bad', { name: nm(x) }))} <small>${esc(t('ui.sec.bad.hint'))}</small></h3>${rowList(list, x, 'bad')}</div>
      ${techSection(x)}
      ${has('note.' + x.id) ? `<p class="note"><b>${esc(t('ui.note.label'))}</b> ${esc(t('note.' + x.id))}</p>` : ''}`;
  }

  function renderTechbar() {
    const on = TECHS.filter(k => active.has(k.key));
    techbar.hidden = !on.length;
    techbar.innerHTML = on.length ? `${esc(t('ui.techbar.active'))}${on.map(k =>
      `<button type="button" class="tchip" data-tech="${esc(k.key)}" title="${esc(t('ui.techbar.off'))}">${owner(k)}: ${esc(tn(k))} <span class="x" aria-hidden="true">✕</span></button>`).join('')}
      <button type="button" class="linkbtn" data-clear="1">${esc(t('ui.techbar.clear'))}</button>` : '';
  }

  function renderFooter() {
    const kbd = s => `<kbd>${s}</kbd>`;
    const wiki = `<a href="https://mbwiki.dreamhaven.com/units/" target="_blank" rel="noopener">${esc(t('ui.foot.wiki'))}</a>`;
    const src = [...new Set((DATA.sources || []).map(s => {
      let host = s; try { host = new URL(s).hostname.replace(/^www\./, ''); } catch (e) {}
      return `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(host)}</a>`;
    }))];
    document.getElementById('foot').innerHTML = `
      <p>${esc(t('ui.foot.ratings'))}</p>
      <p><b>${esc(t('ui.foot.techsLabel'))}</b> ${esc(t('ui.foot.techs'))}</p>
      <p>${esc(t('ui.foot.sources')).replace('{wiki}', wiki)} ${esc(t('ui.foot.translation'))}</p>
      <p>${esc(t('ui.foot.usage')).replace('{enter}', kbd('Enter')).replace('{esc}', kbd('Esc'))}</p>
      ${src.length ? `<p>${esc(t('ui.foot.matchupSources'))} ${src.join(' · ')}</p>` : ''}
      <p>${esc(t('ui.foot.owner'))}</p>`;
  }

  function refresh() {
    updateTiles();
    renderTechbar();
    if (current) select(current, { force: true, save: false });
    else renderEmpty();
  }
  function toggleTech(key) {
    if (!techByKey[key]) return;
    active.has(key) ? active.delete(key) : active.add(key);
    saveTechs();
    refresh();
  }

  // ---------- Einstellungen ----------
  langSel.innerHTML = LANGS.map(l => `<option value="${esc(l.code)}" lang="${esc(l.code)}">${esc(l.name)}</option>`).join('');
  function applyLang(next) {
    lang = STR[next] ? next : lang;
    store.set('lang', lang);
    langSel.value = lang;
    applyStatic();
    buildRoster();
    matches();
    refresh();
  }
  langSel.addEventListener('change', () => applyLang(langSel.value));

  function setGrouping(mode) {
    grouping = mode === 'stage' ? 'stage' : 'class';
    store.set('group', grouping);
    buildRoster();
    matches();
    refresh();
  }
  groupBtns.forEach(b => b.addEventListener('click', () => setGrouping(b.dataset.groupSet)));

  // Einfache Umschalter, die ein Attribut am Wurzelelement setzen
  function setter(key, attr, buttons, dataKey, valid, fallback) {
    const apply = v => {
      v = valid.includes(v) ? v : fallback;
      document.documentElement.setAttribute(attr, v);
      store.set(key, v);
      buttons.forEach(b => b.setAttribute('aria-pressed', b.dataset[dataKey] === v ? 'true' : 'false'));
      hideTip();
    };
    buttons.forEach(b => b.addEventListener('click', () => apply(b.dataset[dataKey])));
    apply(store.get(key));
  }
  setter('theme', 'data-mbk-theme', themeBtns, 'themeSet', ['dark', 'light'], 'dark');
  setter('size', 'data-mbk-size', sizeBtns, 'sizeSet', ['normal', 'large'], 'normal');
  setter('cb', 'data-mbk-cb', cbBtns, 'cbSet', ['0', '1', '2'], '0');
  setter('sidebar', 'data-mbk-sidebar', sideBtns, 'sidebarSet', ['on', 'off'], 'on');

  panel.addEventListener('click', e => {
    const tb = e.target.closest('[data-tech]');
    if (tb) { toggleTech(tb.dataset.tech); return; }
    const b = e.target.closest('[data-go]');
    if (b) { select(b.dataset.go); tileById[b.dataset.go]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  });
  techbar.addEventListener('click', e => {
    if (e.target.closest('[data-clear]')) { active.clear(); saveTechs(); refresh(); return; }
    const tb = e.target.closest('[data-tech]');
    if (tb) toggleTech(tb.dataset.tech);
  });
  roster.addEventListener('click', e => {
    const el = e.target.closest('.tile');
    if (el) select(el.dataset.id);
  });

  // Hover-Modus: Auswahl folgt dem Mauszeiger und bleibt stehen, wenn die Maus das Raster verlässt
  let hover = store.get('hover') === '1';
  let hoverTimer = 0;
  function setHover(on) {
    hover = on;
    hoverBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    store.set('hover', on ? '1' : '0');
    if (!current) renderEmpty();
  }
  hoverBtn.addEventListener('click', () => setHover(!hover));
  roster.addEventListener('pointerover', e => {
    if (!hover || e.pointerType === 'touch') return;
    const el = e.target.closest('.tile');
    if (!el) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => select(el.dataset.id), 45);
  });
  roster.addEventListener('pointerleave', () => { clearTimeout(hoverTimer); hideTip(); });

  // Hinweis an der Kachel: Begründung des Konters (nur ohne Hover-Modus)
  function hideTip() { tip.hidden = true; }
  function showTip(el) {
    const u = byId[el.dataset.id];
    const p = relMap[u.id];
    const x = current && byId[current];
    let html = '';
    if (p && x) {
      const head = p.dir === 'good' ? '▲ ' + t('ui.tip.counters', { a: nm(u), b: nm(x) }) : '▼ ' + t('ui.tip.counters', { a: nm(x), b: nm(u) });
      html = `<b>${esc(head)}</b><span class="tw">${has(p.whyKey) ? esc(t(p.whyKey)) : ''}</span>${p.status !== 'ok' ? statusLine(p) : ''}`;
      tip.className = 'tip ' + p.dir;
    } else if (alt(u) && alt(u) !== nm(u)) {
      html = `<b>${esc(nm(u))}</b><span class="tw">EN: ${esc(alt(u))}</span>`;
      tip.className = 'tip';
    }
    if (!html) return hideTip();
    tip.innerHTML = html;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2));
    let top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  roster.addEventListener('pointerover', e => {
    if (hover || e.pointerType === 'touch') return;
    const el = e.target.closest('.tile');
    if (el) showTip(el); else hideTip();
  });
  window.addEventListener('scroll', hideTip, { passive: true });

  // Klick ins Leere hebt die Auswahl auf; ein offenes Ansicht-Menü schließt sich zuerst
  document.addEventListener('click', e => {
    if (menu.open && !e.target.closest('.menu')) { menu.open = false; return; }
    if (e.target.closest('.tile, .panel, .menu, .techbar, .info, button, a, input, select, label, summary')) return;
    deselect();
  });

  // Suche findet Namen in allen Sprachen
  function matches() {
    const s = q.value.trim().toLowerCase();
    return tiles.filter(el => {
      const hit = !s || byId[el.dataset.id].search.includes(s);
      el.classList.toggle('dim', !hit);
      return hit;
    });
  }
  q.addEventListener('input', () => {
    const m = matches();
    if (q.value.trim() && m.length === 1) select(m[0].dataset.id);
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const m = matches(); if (m[0]) select(m[0].dataset.id); q.select(); }
    if (e.key === 'Escape') { q.value = ''; matches(); q.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target === q || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { if (menu.open) menu.open = false; else deselect(); return; }
    if (e.key === '/') { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key.length === 1 && /\p{L}/u.test(e.key)) {
      q.focus(); q.value = ''; // der Buchstabe landet danach im Feld
    }
  });

  // Start: Sprache anwenden, zuletzt gewählte Einheit, bewusst leere Auswahl bleibt leer
  setHover(hover);
  applyLang(lang);
  const start = store.get('sel');
  if (start === '') renderEmpty();
  else select(byId[start] ? start : (tiles[0] && tiles[0].dataset.id), { save: false });
})();
</script>
